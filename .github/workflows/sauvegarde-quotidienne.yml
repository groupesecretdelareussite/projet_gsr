name: Sauvegarde quotidienne de la base

# Cron horaire UTC — 2h UTC = 3h du matin heure du Bénin (Africa/Porto-Novo).
# workflow_dispatch permet de déclencher manuellement depuis l'onglet Actions,
# indispensable pour tester avant de compter sur le déclenchement planifié.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # nécessaire pour pousser la sauvegarde sur la branche `backups`

jobs:
  sauvegarder-et-verifier:
    runs-on: ubuntu-latest

    # Base Postgres jetable, propre à cette exécution : sert uniquement à
    # prouver que le dump du jour se restaure sans erreur avant de le publier.
    # Version alignée sur celle de Supabase (17.x) — pg_dump refuse de dumper
    # un serveur plus récent que lui-même.
    services:
      postgres-verification:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pg_dump/psql en version récente (dépôt officiel PGDG)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Exporter les schémas public + td (données GSR, hors comptes Auth/Storage)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          FICHIER="backups/gsr-$(date -u +%F).sql.gz"
          # Chemin explicite : le runner a déjà un pg_dump 16 préinstallé qui
          # passe avant le 17 fraîchement installé dans le PATH par défaut.
          # --clean --if-exists : rend le dump auto-nettoyant (DROP IF EXISTS
          # avant chaque CREATE) — indispensable car toute base Postgres,
          # y compris un nouveau projet Supabase, a déjà un schéma "public"
          # par défaut ; sans ça, la restauration échoue systématiquement.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -n public -n td --no-owner --no-privileges --clean --if-exists | gzip > "$FICHIER"
          STATUT_PG_DUMP=${PIPESTATUS[0]}
          if [ "$STATUT_PG_DUMP" -ne 0 ]; then
            echo "::error::pg_dump a échoué (code $STATUT_PG_DUMP) — voir le message d'erreur ci-dessus dans les logs."
            exit 1
          fi
          # Garde-fou explicite : un pg_dump qui "réussit" mais n'exporte rien
          # (mauvais identifiants, mauvaise base, permissions) ne doit jamais
          # passer pour une sauvegarde valide.
          TAILLE_OCTETS=$(stat -c%s "$FICHIER")
          if [ "$TAILLE_OCTETS" -lt 200 ]; then
            echo "::error::Le fichier de sauvegarde ne fait que $TAILLE_OCTETS octets — quasi certainement vide."
            exit 1
          fi
          echo "FICHIER=$FICHIER" >> "$GITHUB_ENV"
          echo "Taille de la sauvegarde : $(du -h "$FICHIER" | cut -f1)"

      - name: Vérifier que la sauvegarde se restaure réellement (pas juste "au cas où")
        run: |
          set -euo pipefail
          export PGPASSWORD=verification
          PSQL=/usr/lib/postgresql/17/bin/psql
          # Remise à zéro explicite : une base Postgres neuve (comme un futur
          # projet Supabase) a déjà un schéma "public" par défaut, incompatible
          # avec un simple rejeu du dump sans nettoyage préalable.
          "$PSQL" -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS td CASCADE;"
          # Les policies RLS de public/td référencent auth.uid()/auth.role() —
          # on stub le strict nécessaire du schéma Supabase Auth (non dumpé,
          # voir plus haut) pour que la restauration de structure passe. Sur
          # un vrai projet Supabase cible, ce schéma existe déjà réellement.
          "$PSQL" -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS 'SELECT NULL::text';
            CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS 'SELECT NULL::jsonb';
          "
          # session_replication_role=replica : désactive la vérification des
          # clés étrangères/déclencheurs le temps du chargement — public.users
          # référence auth.users(id), volontairement absent de la sauvegarde
          # (comptes Supabase Auth, hors périmètre, voir plus haut).
          (echo "SET session_replication_role = replica;"; gunzip -c "$FICHIER") | "$PSQL" -h localhost -U postgres -v ON_ERROR_STOP=1 -q
          echo "Restauration de test réussie — la sauvegarde du $(date -u +%F) est valide."

      - name: Publier la sauvegarde sur la branche backups (jamais sur main, pour ne pas déclencher Vercel)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backups > /dev/null 2>&1; then
            git fetch origin backups
            git checkout backups
          else
            # Première exécution : la branche backups n'existe pas encore.
            # --orphan garde tout le contenu de main dans l'index — on le
            # détache pour ne publier que le dossier backups/.
            git checkout --orphan backups
            git rm -rf --cached . > /dev/null
          fi
          find backups -name "*.sql.gz" -mtime +30 -delete
          git add "$FICHIER"
          git commit -m "Sauvegarde automatique $(date -u +%F)"
          git push origin backups
